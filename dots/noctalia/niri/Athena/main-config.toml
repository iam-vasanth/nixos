config_version = 12

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.24999999441206455
enabled = true

[bar.default]
background_opacity = 0.59999998658895493
center = [ "date", "spacer_2", "clock" ]
end = [ "media", "tray", "battery", "control-center" ]
margin_ends = 0
position = "left"
radius = 0
radius_bottom_right = 10
radius_top_right = 10
start = [ "launcher", "workspaces", "active_window" ]
thickness = 28

[control_center]
hidden_tabs = [ "monitor", "power", "screen-time" ]
width = 600

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "icefish/phone-connect:tile"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 192.0
    box_width = 368.0
    cx = 976.0
    cy = 156.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "secondary"
        shadow = true

[dock]
auto_hide = false
background_opacity = 0.59999998658895493
cross_axis_padding = 5
enabled = true
icon_size = 25
item_spacing = 0
main_axis_padding = 10
position = "right"
radius = 10
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 20

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 1000.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@Virtual-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

  [lockscreen_widgets.grid]
  cell_size = 16
  major_interval = 4
  visible = true

  [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
  box_height = 196.0
  box_width = 720.0
  cx = 640.0
  cy = 681.0
  output = "Virtual-1"
  rotation = 0.0
  type = "login_box"

      [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
      background_color = "surface_variant"
      background_opacity = 0.88
      background_radius = 12.0
      center_password_text = false
      input_opacity = 1.0
      input_radius = 6.0
      layout = "regular"
      show_caps_lock = true
      show_keyboard_layout = true
      show_login_button = true
      show_media = true
      show_session_buttons = true
      show_unlock_hint = true
      show_weather = true

  [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
  box_height = 70.0
  box_width = 400.0
  cx = 960.0
  cy = 961.0
  output = "eDP-1"
  rotation = 0.0
  type = "login_box"

      [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
      background_color = "surface_variant"
      background_opacity = 0.80000000000000004
      background_radius = 10.0
      center_password_text = true
      input_opacity = 1.0
      input_radius = 10.0
      layout = "compact"
      show_caps_lock = true
      show_keyboard_layout = true
      show_login_button = true
      show_media = true
      show_session_buttons = false
      show_unlock_hint = false
      show_weather = false

  [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
  box_height = 224.0
  box_width = 384.0
  cx = 960.0
  cy = 220.0
  output = "eDP-1"
  rotation = 0.0
  type = "clock"

      [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
      background = false
      background_opacity = 0.80000000000000004
      background_padding = 12
      background_radius = 10
      center_text = true
      clock_style = "digital"
      shadow = true
      timezone = "Asia/Kolkata"

  [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
  box_height = 122.4375
  box_width = 434.5
  cx = 960.0
  cy = 864.78125
  output = "eDP-1"
  rotation = 0.0
  type = "audio_visualizer"

      [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
      background = false
      bands = 128
      centered = false
      mirrored = false
      show_when_idle = false

[notification]
background_opacity = 0.79999998211860657
layer = "overlay"

[osd.kinds]
bluetooth = false
lock_keys = false
media = false
nightlight = false
wifi = false

[shell]
app_icon_color = "on_surface_variant"
app_icon_colorize = true
avatar_path = "/home/zoro/Pictures/.face.png"
corner_radius_scale = 0.40000000596046448
font_family = "Atkinson Hyperlegible Next"
lang = "en"
password_style = "random"
polkit_agent = true
telemetry_enabled = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true
    fetch_exchange_rates = false
    show_icons = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"

    [shell.session]
    grid = true
    grid_columns = 1

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "'systemctl' 'reboot' '--firmware-setup'"
        countdown_seconds = 10.0
        enabled = true
        glyph = "adjustments"
        label = "Reboot to UEFI"
        shortcut = "5"
        variant = "default"

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "mango", "niri", "qt", "starship" ]
    community_ids = [ "spicetify", "discord", "telegram", "obsidian", "zed", "zathura", "papirus-icons", "lazygit" ]

        [theme.templates.user.lazyvim]
        input_path = "~/.config/noctalia/templates/lazyvim.lua"
        output_path = "~/.config/nvim/lua/matugen.lua"

[wallpaper]
directory = "/home/zoro/Pictures/Wallpapers"
edge_smoothness = 0.29999999329447746
fill_mode = "fit"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/zoro/Pictures/Wallpapers/wall-22.png"

    [wallpaper.last]
    path = "/home/zoro/Pictures/Wallpapers/wall-22.png"

    [wallpaper.monitors.Virtual-1]
    path = "/home/zoro/Pictures/Wallpapers/wall-22.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/zoro/Pictures/Wallpapers/wall-22.png"

[weather]
enabled = false

[widget.battery]
hide_when_plugged = true

[widget.date]
format = "{:%d:%m}"

[widget.launcher]
capsule = true
capsule_opacity = 0.5
custom_image = "/home/zoro/Pictures/.nix.png"
custom_image_colorize = true

[widget.spacer_2]
type = "spacer"

[widget.workspaces]
show_labels = false
