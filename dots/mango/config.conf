// ---------------------------------------------------------------------------
// Input - keyboard
// ---------------------------------------------------------------------------

xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlockon=0

// ---------------------------------------------------------------------------
// Input - trackpad
// ---------------------------------------------------------------------------

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0.2
scroll_method=1
disable_while_typing=1
drag_lock=1

// ---------------------------------------------------------------------------
// Input - mouse
// ---------------------------------------------------------------------------

mouse_accel_profile=1
mouse_accel_speed=0.0
mouse_natural_scrolling=1

// ---------------------------------------------------------------------------
// Monitor rules
// ---------------------------------------------------------------------------

monitorrule=name:^eDP-1$,width:3840,height:2160,refresh:60,x:0,y:0,scale:2,vrr:0,rr:0

// ---------------------------------------------------------------------------
// Layout - scroller as default
// ---------------------------------------------------------------------------

circle_layout=scroller,tile,monocle

scroller_structs=20
scroller_default_proportion=0.9
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_proportion_preset=0.33333,0.5,0.66667

// Master-stack layout settings (used by `tile`)
new_is_master=1
default_mfact=0.5
default_nmaster=1
smartgaps=0

// Persistent tags 1 and 2 default to scroller, mirroring niri's two-workspace setup
tagrule=id:1,layout_name:scroller,no_hide:1
tagrule=id:2,layout_name:scroller,no_hide:1

// ---------------------------------------------------------------------------
// Theming - dimensions
// ---------------------------------------------------------------------------

gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x808080FF
focuscolor=0xFFFFFFFF
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

// ---------------------------------------------------------------------------
// Theming - colors
// ---------------------------------------------------------------------------

rootcolor=0x131316ff
bordercolor=0x131316ff
focuscolor=0xbdc2ffff
urgentcolor=0xffb4abff
dropcolor=0xbdc2ff80

cursor_size=24
cursor_theme=Bibata-Modern-Classic

// ---------------------------------------------------------------------------
// Window effects - corners, shadow, blur
// ---------------------------------------------------------------------------

border_radius=10
border_radius_location_default=0
no_radius_when_single=0

shadows=1
shadow_only_floating=0
shadows_size=4
shadows_blur=12
shadows_position_x=2
shadows_position_y=2
shadowscolor=0x000000ff

blur=0
blur_layer=0
blur_optimized=1
blur_params_radius=5
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

focused_opacity=1.0
unfocused_opacity=1.0

// ---------------------------------------------------------------------------
// Animations
// ---------------------------------------------------------------------------

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=150
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

// ---------------------------------------------------------------------------
// Window rules
// ---------------------------------------------------------------------------

windowrule=isfloating:1,appid:pavucontrol
windowrule=isfloating:1,title:Picture-in-Picture

// ---------------------------------------------------------------------------
// Misc
// ---------------------------------------------------------------------------

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
syncobj_enable=1
allow_tearing=1


// ---------------------------------------------------------------------------
// Key bindings
// ---------------------------------------------------------------------------

// Apps
bind=SUPER,T,spawn,kitty
bind=SUPER,B,spawn,firefox
bind=SUPER,E,spawn,thunar
bind=ALT,Return,spawn,kitty
bind=ALT,Space,spawn,rofi -show drun

// Window management
bind=SUPER,Q,killclient
bind=SUPER,F,togglefullscreen
bind=SUPER,SHIFT+F,togglefloating

// Focus movement
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

// Move windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

// Tags (workspaces) - mirrors your niri Mod+1/Mod+2 bindings
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2

// Layout
bind=SUPER,R,switch_layout
bind=SUPER,C,centerwin

// Scroller proportion presets
bind=SUPER,Equal,switch_proportion_preset

// Screenshots
bind=NONE,Print,spawn,grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png
bind=ALT,Print,spawn,grim ~/Pictures/Screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

// Media keys (playerctl already runs via your mpris systemd unit)
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

// Volume (wpctl / WirePlumber - matches your pipewire setup)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

// Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

// Reload / quit
bind=SUPER,Ctrl+R,reload_config
bindl=SUPER,M,quit


// ---------------------------------------------------------------------------
// Environment variables
// ---------------------------------------------------------------------------

env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango
env=QT_QPA_PLATFORM,wayland
env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORMTHEME,qt6ct
env=MOZ_ENABLE_WAYLAND,1
env=OZONE_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
