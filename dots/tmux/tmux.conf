# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000
set -g focus-events on
set-option -sa terminal-overrides ",xterm*:Tc"

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits (keep cwd)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Status bar - Noctalia palette match
set -g status-position top
set -g status-style bg=#131316,fg=#bdc2ff
set -g status-left ""
set -g status-right " #[fg=#bdc2ff]%H:%M "
set -g window-status-current-format " #[fg=#bdc2ff,bold]#I:#W "
set -g window-status-format " #[fg=#808080]#I:#W "
set -g pane-border-style fg=#131316
set -g pane-active-border-style fg=#bdc2ff
