############################################
# Seeking
############################################

RIGHT seek 5
LEFT seek -5

Shift+RIGHT seek 30
Shift+LEFT seek -30

UP seek 60
DOWN seek -60

Ctrl+RIGHT seek 300
Ctrl+LEFT seek -300

############################################
# Frame stepping
############################################

. frame-step
, frame-back-step

############################################
# Playback speed
############################################

] add speed 0.10
[ add speed -0.10
\ set speed 1.0

############################################
# Volume
############################################

+ add volume 5
- add volume -5

m cycle mute

############################################
# Subtitles
############################################

v cycle sub-visibility
V cycle sub

b cycle audio

############################################
# Fullscreen
############################################

f cycle fullscreen

############################################
# Screenshot
############################################

s screenshot
S screenshot video

############################################
# Playlist
############################################

> playlist-next
< playlist-prev

############################################
# Loop
############################################

l cycle-values loop-file no inf
L cycle-values loop-playlist no inf

############################################
# Zoom
############################################

Alt++ add video-zoom 0.25
Alt+- add video-zoom -0.25

Alt+0 set video-zoom 0

############################################
# Pan
############################################

Alt+LEFT add video-pan-x -0.05
Alt+RIGHT add video-pan-x 0.05

Alt+UP add video-pan-y -0.05
Alt+DOWN add video-pan-y 0.05

############################################
# Rotate
############################################

r add video-rotate 90

############################################
# AB Loop
############################################

i ab-loop

############################################
# Window always on top
############################################

t cycle ontop

############################################
# OSC
############################################

TAB cycle osc

############################################
# Stats
############################################

Ctrl+i script-binding stats/display-stats

############################################
# Shaders
############################################

glsl-shaders-append=~~/shaders/FSRCNNX_x2_8-0-4-1.glsl
